<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search | GPU Finder</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif' font-size='15' font-weight='700' fill='white'%3EGF%3C/text%3E%3C/svg%3E" />
<style>
:root{--bg:#0b0c0f;--elev:#12141a;--field:#0f1218;--muted:#a3acbb;--text:#e7ecf3;--accent:#3b82f6;--accent-soft:rgba(59,130,246,.14);--border:#1f2430;--row:#0e1117;--good:#34d399}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;color:var(--text);background:var(--bg)}
a{color:#9ec3ff;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:26px 16px 44px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#60a5fa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
h1{font-size:20px;margin:0}
nav a{padding:8px 12px;border-radius:10px;color:var(--muted)} nav a:hover{background:#171b25;color:var(--text)}
.num{font-variant-numeric:tabular-nums}

/* search */
.search{position:relative}
.search input{width:100%;background:var(--field);border:1px solid var(--border);color:var(--text);padding:16px 20px 16px 48px;border-radius:12px;font-size:18px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:12px system-ui;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 7px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--elev);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:20;padding:6px;display:none;max-height:380px;overflow:auto}
.suggest.open{display:block}
.sg{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;cursor:pointer}
.sg.active,.sg:hover{background:var(--accent-soft)}
.sg b{font-weight:600;color:#fff}
.sg .meta{color:var(--muted);font-size:13px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.ctl{display:flex;align-items:center;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:0 4px 0 12px;height:38px;transition:border-color .15s,background .15s}
.ctl.on{border-color:var(--accent);background:var(--accent-soft)}
.ctl span{color:var(--muted);font-size:13px;margin-right:6px;white-space:nowrap}
.ctl select,.ctl input{background:transparent;border:none;color:var(--text);font:inherit;height:36px;padding:0 8px 0 0;outline:none}
.ctl select{cursor:pointer}
.ctl select option{background:var(--elev)}
.ctl input{width:84px}
.ctl input.wide{width:140px}
.clear{color:var(--muted);background:none;border:none;font:inherit;cursor:pointer;padding:8px;display:none}
.clear.show{display:inline}
.clear:hover{color:var(--text)}

/* summary + sort */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.summary{font-size:15px}
.summary strong{font-size:17px}
.summary .muted{color:var(--muted)}
.seg{display:flex;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--accent);color:#fff}
.seg button:not(.on):hover{color:var(--text)}

/* table */
.tablewrap{border:1px solid var(--border);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--field);color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.sorted{color:var(--text)}
th .arr{color:var(--accent);margin-left:4px}
td{padding:11px 14px;border-bottom:1px solid #151a24;background:var(--row);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#141926}
.r{text-align:right}
.gpu{font-weight:600;font-size:15px;color:#fff}
.gpu .x{color:var(--muted);font-weight:500;margin-right:4px}
.sub{color:var(--muted);font-size:12px}
.price{font-weight:600;font-size:15px}
.best{color:var(--good)}
.prov{color:var(--text)}
.loc{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.more{display:block;margin:14px auto 0;background:var(--field);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font:inherit;cursor:pointer}
.more:hover{border-color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.skel td div{height:12px;border-radius:6px;background:linear-gradient(90deg,#161a23,#1e2330,#161a23);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
tbody tr.fade{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(2px)}}
mark{background:none;color:var(--accent);font-weight:700}
@media (max-width:720px){.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">GF</div><h1>GPU Finder — Search</h1></div>
    <nav><a href="index.html">Home</a><a href="blog.html">Blog</a><a href="about.html">About</a><a href="https://gpufindr.com/docs/index.html">API</a></nav>
  </header>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Search GPUs: rtx 4090, h100, a6000…" autocomplete="off" spellcheck="false" />
    <kbd>/</kbd>
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="filters">
    <label class="ctl" id="c-source"><span>Provider</span><select id="source"><option value="">All</option></select></label>
    <label class="ctl" id="c-price"><span>Max $/h</span><input id="max_price" class="num" type="number" min="0" step="0.1" placeholder="Any" /></label>
    <label class="ctl" id="c-vram"><span>VRAM</span><select id="min_vram">
      <option value="">Any</option><option value="16">16 GB+</option><option value="24">24 GB+</option><option value="48">48 GB+</option><option value="80">80 GB+</option><option value="140">140 GB+</option></select></label>
    <label class="ctl" id="c-ngpu"><span>GPUs</span><select id="ngpu">
      <option value="">Any</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="8">8+</option></select></label>
    <label class="ctl" id="c-cpu"><span>vCPU</span><select id="min_cpu">
      <option value="">Any</option><option value="8">8+</option><option value="16">16+</option><option value="32">32+</option><option value="64">64+</option><option value="128">128+</option></select></label>
    <label class="ctl" id="c-ram"><span>RAM</span><select id="min_ram">
      <option value="">Any</option><option value="32">32 GB+</option><option value="64">64 GB+</option><option value="128">128 GB+</option><option value="256">256 GB+</option><option value="512">512 GB+</option></select></label>
    <label class="ctl" id="c-loc"><span>Location</span><input id="location" class="wide" type="text" placeholder="Any" /></label>
    <button class="clear" id="clear">Clear filters</button>
  </div>

  <div class="bar">
    <div class="summary" id="summary"></div>
    <div class="seg" id="seg">
      <button data-sort="relevance">Best match</button>
      <button data-sort="value">Best value</button>
      <button data-sort="price">Cheapest</button>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button class="more" id="more">Show more</button>
</div>

<script>
const $=s=>document.querySelector(s);
const API='https://gpufindr.com/gpus';
const PAGE=50;
const COLS=[
  {k:'gpu',   label:'GPU',          sort:o=>norm(o.name)},
  {k:'source',label:'Provider',     sort:o=>o.source},
  {k:'loc',   label:'Location',     sort:o=>o.location||'~', cls:'hide-sm'},
  {k:'cpu',   label:'vCPU',         sort:o=>o.cpu_cores||-1, r:1},
  {k:'ram',   label:'RAM',          sort:o=>o.ram_mb||-1, r:1},
  {k:'tflops',label:'TFLOPs',       sort:o=>o.total_flops, r:1},
  {k:'value', label:'TFLOPs per $/h',sort:o=>o.flops_per_dollar_ph, r:1, cls:'hide-sm'},
  {k:'rel',   label:'Reliability',  sort:o=>o.reliability||-1, r:1, cls:'hide-sm'},
  {k:'pergpu',label:'$/GPU·h',      sort:o=>o.gpu_cost_ph, r:1, cls:'hide-sm'},
  {k:'price', label:'$/h',          sort:o=>o.total_cost_ph, r:1},
];
const PRESET={value:['value',-1],price:['price',1]};
let state={q:'',sort:'relevance',col:null,dir:-1,shown:PAGE};
let data=[];

// ---------- name similarity ----------
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim();}
function compact(s){return norm(s).replace(/[\s\-_]/g,'');}
function tokens(s){return norm(s).split(/[\s\-_]+/).filter(Boolean);}
// Score how well a GPU name matches the query. 0 = no match.
function matchScore(name,q){
  const n=norm(name), qn=norm(q); if(!qn) return 1;
  if(n===qn || compact(n)===compact(qn)) return 1000;
  const nt=tokens(n), qt=tokens(qn);
  let s=0;
  for(const t of qt){
    let best=0;
    nt.forEach((w,i)=>{
      const pos=Math.max(0,12-i*4);              // earlier tokens weigh more: "RTX 4090" beats "Q RTX 4000"
      if(w===t) best=Math.max(best,60+pos);
      else if(w.startsWith(t)) best=Math.max(best,40+pos);
      else if(w.includes(t)) best=Math.max(best,10);
    });
    if(!best && compact(n).includes(compact(t))) best=8; // "4000ada" vs "4000 ada"
    if(!best) return 0;                          // every query token must match
    s+=best;
  }
  if(n.startsWith(qn)) s+=50;
  s-=Math.max(0,nt.length-qt.length)*3;          // prefer tighter names
  return s;
}

// ---------- suggestions ----------
const sugEl=$('#suggest'); let sugIdx=-1, sugItems=[];
function models(){
  const m=new Map();
  for(const o of data){
    const key=compact(o.name);
    const e=m.get(key)||{name:o.name,n:0,min:Infinity,vram:o.vram_mb};
    e.n++; e.min=Math.min(e.min,o.gpu_cost_ph||o.total_cost_ph);
    if(/[A-Z]/.test(o.name)&&!/[A-Z]/.test(e.name)) e.name=o.name; // prefer the properly cased spelling
    m.set(key,e);
  }
  return [...m.values()];
}
let MODELS=[];
function renderSuggest(){
  const q=$('#q').value;
  if(!q.trim()){sugEl.classList.remove('open');return;}
  sugItems=MODELS.map(m=>({...m,s:matchScore(m.name,q)})).filter(m=>m.s>0)
    .sort((a,b)=>b.s-a.s||b.n-a.n).slice(0,8);
  sugIdx=-1;
  sugEl.innerHTML=sugItems.map((m,i)=>`<div class="sg" data-i="${i}"><span>${hl(m.name,q)}</span><span class="meta num">${m.n} offer${m.n>1?'s':''} · from $${m.min.toFixed(2)}/h · ${Math.round(m.vram/1024)} GB</span></div>`).join('')
    || `<div class="sg"><span class="meta">No GPU matches “${esc(q)}”</span></div>`;
  sugEl.classList.add('open');
}
function hl(name,q){
  let out=esc(name);
  for(const t of tokens(q)) out=out.replace(new RegExp('\\b('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'),'<mark>$1</mark>');
  return out;
}
function pick(i){const m=sugItems[i]; if(!m) return; $('#q').value=m.name; sugEl.classList.remove('open'); apply();}
sugEl.addEventListener('mousedown',e=>{const el=e.target.closest('.sg'); if(el?.dataset.i) {e.preventDefault(); pick(+el.dataset.i);}});
$('#q').addEventListener('input',()=>{renderSuggest(); debounced();});
$('#q').addEventListener('focus',renderSuggest);
$('#q').addEventListener('blur',()=>sugEl.classList.remove('open'));
$('#q').addEventListener('keydown',e=>{
  const els=sugEl.querySelectorAll('.sg[data-i]');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); sugIdx=(sugIdx+(e.key==='ArrowDown'?1:-1)+els.length)%els.length; els.forEach((el,i)=>el.classList.toggle('active',i===sugIdx));}
  else if(e.key==='Enter'){ if(sugIdx>=0) pick(sugIdx); else {sugEl.classList.remove('open'); apply();} }
  else if(e.key==='Escape'){sugEl.classList.remove('open');}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});

// ---------- filters ----------
const FILTERS=[['source','c-source'],['max_price','c-price'],['min_vram','c-vram'],['ngpu','c-ngpu'],['min_cpu','c-cpu'],['min_ram','c-ram'],['location','c-loc']];
FILTERS.forEach(([id])=>$('#'+id).addEventListener($('#'+id).tagName==='SELECT'?'change':'input',()=>{state.shown=PAGE;apply();}));
$('#clear').onclick=()=>{FILTERS.forEach(([id])=>$('#'+id).value='');apply();};
$('#seg').onclick=e=>{const b=e.target.closest('button'); if(!b) return; setPreset(b.dataset.sort); apply();};
$('#rows').addEventListener('click',e=>{const tr=e.target.closest('tr[data-url]'); if(!tr) return; const u=new URL(tr.dataset.url,location.href); if(u.protocol==='https:'||u.protocol==='http:') window.open(u.href,'_blank','noopener');});
$('#more').onclick=()=>{state.shown+=PAGE; render(false);};
function setPreset(p){state.sort=p; if(PRESET[p]){[state.col,state.dir]=PRESET[p];} else {state.col=null;}}

let timer; function debounced(){clearTimeout(timer); timer=setTimeout(()=>{state.shown=PAGE;apply();},150);}

let view=[];
function apply(){
  const q=$('#q').value.trim();
  const src=$('#source').value, mp=parseFloat($('#max_price').value), mv=+$('#min_vram').value, ng=+$('#ngpu').value, mc=+$('#min_cpu').value, mr=+$('#min_ram').value, loc=norm($('#location').value);
  FILTERS.forEach(([id,c])=>$('#'+c).classList.toggle('on',!!$('#'+id).value));
  $('#clear').classList.toggle('show',FILTERS.some(([id])=>$('#'+id).value));
  // typing a query switches to "Best match"; clearing it falls back to "Best value"
  if(q && state.q!==q && state.sort!=='relevance' && !state.q) setPreset('relevance');
  if(!q && state.sort==='relevance') setPreset('value');
  state.q=q;

  view=data.map(o=>({o,s:matchScore(o.name,q)})).filter(({o,s})=>
    s>0 && (!src||o.source===src) && (isNaN(mp)||o.total_cost_ph<=mp) &&
    (!mv||o.vram_mb/1024>=mv-1) && (!ng||(ng===8?o.num_gpus>=8:o.num_gpus===ng)) &&
    (!mc||o.cpu_cores>=mc) && (!mr||o.ram_mb/1024>=mr-1) &&
    (!loc||norm(o.location).includes(loc)));

  if(state.col){
    const c=COLS.find(c=>c.k===state.col);
    view.sort((a,b)=>{const x=c.sort(a.o),y=c.sort(b.o); return (x>y?1:x<y?-1:0)*state.dir;});
  } else {
    // relevance: best name match first, then best value inside the same match tier
    view.sort((a,b)=>b.s-a.s||b.o.flops_per_dollar_ph-a.o.flops_per_dollar_ph);
  }
  const share=new URLSearchParams(); if(q) share.set('q',q);
  FILTERS.forEach(([id])=>{const v=$('#'+id).value.trim(); if(v) share.set(id,v);});
  history.replaceState(null,'',location.pathname+(share.toString()?'?'+share:''));
  render(true);
}

// ---------- render ----------
function renderHead(){
  $('#head').innerHTML=COLS.map(c=>{
    const on=state.col===c.k;
    return `<th data-k="${c.k}" class="${c.r?'r ':''}${c.cls||''}${on?' sorted':''}">${c.label}${on?`<span class="arr">${state.dir>0?'↑':'↓'}</span>`:''}</th>`;
  }).join('');
}
$('#head').onclick=e=>{
  const th=e.target.closest('th'); if(!th) return;
  const k=th.dataset.k;
  if(state.col===k) state.dir*=-1; else {state.col=k; state.dir=(k==='price'||k==='pergpu'||k==='gpu'||k==='source'||k==='loc')?1:-1;}
  state.sort=Object.keys(PRESET).find(p=>PRESET[p][0]===state.col&&PRESET[p][1]===state.dir)||'custom';
  apply();
};
function render(reset){
  renderHead();
  document.querySelectorAll('#seg button').forEach(b=>{b.classList.toggle('on',b.dataset.sort===state.sort); b.hidden=b.dataset.sort==='relevance'&&!state.q;});
  const rows=view.slice(0,state.shown);
  const minPrice=Math.min(...view.map(v=>v.o.total_cost_ph));
  const provs=new Set(view.map(v=>v.o.source)).size;
  $('#summary').innerHTML=view.length
    ? `<strong class="num">${view.length}</strong> offers <span class="muted num">from ${provs} provider${provs>1?'s':''}</span>`
    : '<span class="muted">No offers match.</span>';
  $('#rows').innerHTML=rows.map(({o})=>row(o,o.total_cost_ph===minPrice)).join('')
    || `<tr><td colspan="${COLS.length}" class="empty">Nothing matches these filters. <a href="#" onclick="$('#clear').click();return false">Clear filters</a></td></tr>`;
  $('#more').style.display=view.length>state.shown?'block':'none';
  $('#more').textContent=`Show more (${view.length-state.shown} left)`;
  window._rows=rows;
}
function row(o,best){
  const gb=Math.round(o.vram_mb/1024);
  const rel=o.reliability>0?(o.reliability*100).toFixed(0)+'%':'—';
  return `<tr class="fade" data-url="${esc(o.url)}">
    <td><div class="gpu">${o.num_gpus>1?`<span class="x num">${o.num_gpus}×</span>`:''}${hl(o.name,state.q)}</div><div class="sub num">${gb} GB VRAM${o.num_gpus>1?' each':''}</div></td>
    <td class="prov">${esc(o.source)}</td>
    <td class="loc hide-sm" title="${esc(o.location)}">${esc(o.location)||'—'}</td>
    <td class="r num">${o.cpu_cores>0?Math.round(o.cpu_cores):'—'}</td>
    <td class="r num">${o.ram_mb>0?Math.round(o.ram_mb/1024)+' GB':'—'}</td>
    <td class="r num">${fmt(o.total_flops)}</td>
    <td class="r num hide-sm">${fmt(o.flops_per_dollar_ph)}</td>
    <td class="r num hide-sm">${rel}</td>
    <td class="r num hide-sm">$${o.gpu_cost_ph.toFixed(2)}</td>
    <td class="r num price${best?' best':''}">$${o.total_cost_ph.toFixed(2)}</td>
  </tr>`;
}
function fmt(n){return Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:n<10?1:0}):'—';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ---------- boot (skeleton, then data) ----------
renderHead();
$('#rows').innerHTML=Array.from({length:8},()=>`<tr class="skel">${COLS.map(c=>`<td class="${c.cls||''}"><div style="width:${40+Math.random()*50}%"></div></td>`).join('')}</tr>`).join('');
$('#summary').innerHTML='<span class="muted">Loading offers…</span>';
fetch(API+'?limit=1000').then(r=>{if(!r.ok) throw new Error(r.status+' '+r.statusText); return r.json();}).then(rows=>{
  data=rows.filter(o=>o.total_cost_ph>0);
  MODELS=models();
  const counts={}; data.forEach(o=>counts[o.source]=(counts[o.source]||0)+1);
  $('#source').innerHTML='<option value="">All</option>'+Object.keys(counts).sort().map(s=>`<option value="${esc(s)}">${esc(s)} (${counts[s]})</option>`).join('');
  const p=new URLSearchParams(location.search); if(p.get('q')) $('#q').value=p.get('q');
  FILTERS.forEach(([id])=>{if(p.get(id)) $('#'+id).value=p.get(id);});
  setPreset($('#q').value?'relevance':'value');
  apply();
}).catch(err=>{
  $('#summary').innerHTML=`<span class="muted">Couldn't load offers (${esc(err.message)}).</span>`;
  $('#rows').innerHTML=`<tr><td colspan="${COLS.length}" class="empty">Try reloading the page.</td></tr>`;
});
</script>
</body>
</html>
